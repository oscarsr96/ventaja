name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  quality:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  pipeline:
    if: github.event_name != 'schedule'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ventaja/raw
          key: skillcorner-raw-114243-v1
      - run: uv sync
      - run: uv run ventaja data pull --game 114243
      - run: uv run ventaja data build --game 114243
      - run: uv run ventaja validate score --game 114243
      - run: uv run ventaja snapshot shot-114243-1-0
      - run: uv run ventaja decisions build --game 114243
      # Check 1 is a live-session diagnostic (ADR-0004); checks 2-4 block.
      - run: uv run ventaja validate decisions --game 114243 --allow-fail cost_falls_with_clock
      - run: uv run ventaja decisions show shot-114243-1-0
      - run: uv run ventaja curves build --game 114243
      - run: uv run ventaja clip shot-114243-1-0 --out /tmp/clip.gif
      - run: uv run ventaja reel rankings --game 114243 --n 3

  pipeline-all:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ventaja data pull --all
      - run: uv run ventaja data build --all
      - run: uv run ventaja validate score --all
      # Drift check: retrain to /tmp, never overwrite the versioned model.
      - run: uv run ventaja model train --all --out /tmp/model.json --figure /tmp/calibration.png
      # validate reads the decisions tables, so build them with the versioned model first.
      - run: uv run ventaja decisions build --all
      # Check 1 is a live-session diagnostic (ADR-0004); checks 2-4 block.
      - run: uv run ventaja validate decisions --all --allow-fail cost_falls_with_clock
      # Curves to /tmp: the versioned artifacts/curves/ is never overwritten.
      - run: uv run ventaja curves build --all --out /tmp/curves
      - run: uv run ventaja reel rankings --all
