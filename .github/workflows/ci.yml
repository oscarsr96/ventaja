name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  quality:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  pipeline:
    if: github.event_name != 'schedule'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ventaja/raw
          key: skillcorner-raw-114243-v1
      - run: uv sync
      - run: uv run ventaja data pull --game 114243
      - run: uv run ventaja data build --game 114243
      - run: uv run ventaja validate score --game 114243
      - run: uv run ventaja snapshot shot-114243-1-0
      - run: uv run ventaja decisions build --game 114243
      # Check 1 is a live-session diagnostic (ADR-0004); checks 2-4 block.
      - run: uv run ventaja validate decisions --game 114243 --allow-fail cost_falls_with_clock
      - run: uv run ventaja decisions show shot-114243-1-0
      - run: uv run ventaja curves build --game 114243
      - run: uv run ventaja frames build --game 114243
      - run: uv run ventaja clip shot-114243-1-0 --out /tmp/clip.gif
      - run: uv run ventaja reel rankings --game 114243 --n 3
      # Player cards read the versioned artifacts/players.parquet; no build needed.
      - run: uv run ventaja player show 58474
      - run: uv run ventaja player rank --n 5
      # MCP reads the packaged artifacts: an empty build dir keeps it off the one-game build above.
      - run: VENTAJA_BUILD_DIR=/tmp/empty-build uv run ventaja mcp call list_games
      - run: |
          VENTAJA_BUILD_DIR=/tmp/empty-build uv run ventaja mcp call explain_shot '{"shot_id": "shot-114243-1-0"}'
      - run: VENTAJA_BUILD_DIR=/tmp/empty-build uv run ventaja mcp tools
      # Unified app from a clean clone: packaged artifacts only, no build.
      - run: |
          VENTAJA_BUILD_DIR=/tmp/empty-build uv run ventaja app --no-open --port 8765 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8765/api/court >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8765/ >/dev/null
          curl -sf http://127.0.0.1:8765/api/featured | grep -q default_shot
          curl -sf http://127.0.0.1:8765/api/ask/schema | grep -q what_if
          curl -sf http://127.0.0.1:8765/api/curve/shot-191313-1-31 | grep -q decision_t
          kill %1

  pipeline-all:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ventaja data pull --all
      - run: uv run ventaja data build --all
      - run: uv run ventaja validate score --all
      # Drift check: retrain to /tmp, never overwrite the versioned model.
      - run: uv run ventaja model train --all --out /tmp/model.json --figure /tmp/calibration.png
      # validate reads the decisions tables, so build them with the versioned model first.
      - run: uv run ventaja decisions build --all
      # Check 1 is a live-session diagnostic (ADR-0004); checks 2-4 block.
      - run: uv run ventaja validate decisions --all --allow-fail cost_falls_with_clock
      # Curves to /tmp: the versioned artifacts/curves/ is never overwritten.
      - run: uv run ventaja curves build --all --out /tmp/curves
      - run: uv run ventaja frames build --all --out /tmp/frames
      - run: uv run ventaja reel rankings --all
      - run: uv run ventaja player build --out /tmp/players
