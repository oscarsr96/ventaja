name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  quality:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  pipeline:
    if: github.event_name != 'schedule'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ventaja/raw
          key: skillcorner-raw-114243-v1
      - run: uv sync
      - run: uv run ventaja data pull --game 114243
      - run: uv run ventaja data build --game 114243
      - run: uv run ventaja validate score --game 114243
      - run: uv run ventaja snapshot shot-114243-1-0
      - run: uv run ventaja decisions build --game 114243
      # Sanity checks are diagnostics for the live validation session.
      # cost_falls_with_clock currently fails on the full 10-game build (ADR-0004)
      # and the checks may flip when the model or constants change, so they are
      # kept visible without blocking CI.
      - run: uv run ventaja validate decisions --game 114243
        continue-on-error: true
      - run: uv run ventaja decisions show shot-114243-1-0

  pipeline-all:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ventaja data pull --all
      - run: uv run ventaja data build --all
      - run: uv run ventaja validate score --all
      # Drift check: retrain to /tmp, never overwrite the versioned model.
      - run: uv run ventaja model train --all --out /tmp/model.json --figure /tmp/calibration.png
      # validate reads the decisions tables, so build them with the versioned model first.
      - run: uv run ventaja decisions build --all
      # Diagnostics for the live validation session; visible but non-blocking.
      - run: uv run ventaja validate decisions --all
        continue-on-error: true
