[project]
name = "ventaja"
version = "0.1.0"
description = "Basketball tracking analytics for the SkillCorner x PySport Analytics Cup"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
    { name = "Oscar Sanchez Rueda", email = "oscarsrueda96@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "polars>=2.1.0",
    "pydantic>=2",
    "typer>=0.27.3",
]

[project.scripts]
ventaja = "ventaja.cli:app"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
extend-exclude = ["docs", ".superpowers"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
packages = ["ventaja"]

[tool.pytest.ini_options]
testpaths = ["tests"]
