[project]
name = "ventaja"
version = "0.1.0"
description = "Basketball tracking analytics for the SkillCorner x PySport Analytics Cup"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
    { name = "Oscar Sanchez Rueda", email = "oscarsrueda96@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "polars>=2.1.0",
    "pydantic>=2",
    "scikit-learn>=1.9.1",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
ventaja = "ventaja.cli:app"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
extend-exclude = ["docs", ".superpowers"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
packages = ["ventaja"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "realdata: needs the full SkillCorner data (VENTAJA_REALDATA_DIR, VENTAJA_REALDATA_BUILD_DIR)",
]

[[tool.mypy.overrides]]
module = ["sklearn.*", "matplotlib.*"]
ignore_missing_imports = true
